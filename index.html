<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תשבצי היגיון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#1A1B1F; --muted:#5F646C; --line:#CDD1D7;
  --pen:#2343C4; --ok:#17784C; --bad:#BF3328; --block:#1A1B1F;
  --s1:#2343C4; --s2:#B4540A; --s3:#0E7C72;
  color-scheme:light;
  --serif:"Frank Ruhl Libre","David","Times New Roman",serif;
  --sans:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --surface:#1A1D22; --ink:#ECEDEF; --muted:#9CA2AA; --line:#353A42;
    --pen:#93A6FF; --ok:#52C68E; --bad:#FF7466; --block:#000000; color-scheme:dark;
    --s1:#93A6FF; --s2:#F2A04B; --s3:#3FD0C0;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D22; --ink:#ECEDEF; --muted:#9CA2AA; --line:#353A42;
  --pen:#93A6FF; --ok:#52C68E; --bad:#FF7466; --block:#000000; color-scheme:dark;
  --s1:#93A6FF; --s2:#F2A04B; --s3:#3FD0C0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px}

.wrap{max-width:480px;margin:0 auto;padding:20px 20px 40px}

/* header + levels */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
h1{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.1;margin:0}
.levels{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.cells{display:flex;gap:0;border:1.5px solid var(--ink)}
.cells button{width:34px;height:34px;border:0;border-inline-start:1.5px solid var(--ink);background:var(--surface);
  font-family:var(--serif);font-weight:700;font-size:16px;cursor:pointer;padding:0}
.cells button:first-child{border-inline-start:0}
.cells button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* clue */
.clue{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:27px;line-height:1.45;min-height:2.9em}
.clue .part{white-space:normal}
.clue .sep{display:inline-block;width:2px;height:1em;background:var(--pen);margin:0 .4em;vertical-align:-.12em;border-radius:1px}
.meta{margin:0 0 22px;color:var(--muted);font-size:15px}

/* answer board */
.board{position:relative;display:flex;justify-content:center;gap:var(--gap);margin:0 0 10px;cursor:text}
.word{display:flex}
.cell{width:var(--cell);height:var(--cell);border:1.5px solid var(--ink);margin-inline-start:-1.5px;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;
  font-size:calc(var(--cell) * .58);color:var(--pen);transition:border-color .15s,color .15s}
.word .cell:first-child{margin-inline-start:0}
.cell.given{color:var(--ink)}
.link:disabled{opacity:.4;cursor:default;text-decoration:none}
.board.focus .cell.caret{outline:2px solid var(--pen);outline-offset:-5px}
.gapblock{width:calc(var(--cell) * .42);height:var(--cell);background:var(--block)}
.board.ok .cell{color:var(--ok);border-color:var(--ok)}
.board.shown .cell{color:var(--muted)}
.board.bad .cell{border-color:var(--bad)}
.board.bad{animation:shake .32s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.board.bad{animation:none}.cell{transition:none}}
#entry{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;color:transparent;caret-color:transparent;background:transparent}
.msg{min-height:1.5em;margin:0 0 18px;text-align:center;font-weight:600;font-size:16px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:48px;border-radius:6px;border:1.5px solid var(--ink);background:var(--surface);font-weight:600;font-size:16px;cursor:pointer}
.btn.primary{grid-column:1 / -1;background:var(--ink);color:var(--surface)}
.btn[aria-pressed="true"]{border-color:var(--pen);color:var(--pen)}
.btn:disabled{opacity:.4;cursor:default}
.links{display:flex;justify-content:space-between;margin-top:14px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* hints + reveal */
.hints{list-style:none;margin:24px 0 0;padding:0}
.hints li{padding:12px 0;border-top:1px solid var(--line)}
.hints li:last-child{border-bottom:1px solid var(--line)}
.hnum{display:block;font-size:13px;font-weight:700;color:var(--pen);margin-bottom:2px}
.reveal{margin:0 0 22px;padding:14px 16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.explain{margin:0}
.blk{padding:12px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:2px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.line{margin:0;font-size:18px;line-height:1.5}
.ph{font-family:var(--serif);font-weight:500}
.line b,.pieces b{font-weight:700}
.pieces{list-style:none;margin:6px 0 0;padding:0}
.pieces li{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:16px;padding:3px 0}
.pieces li .ph{color:var(--muted)}
.sw{display:inline-block;width:14px;height:14px;flex:none;align-self:center;margin-inline-end:6px;vertical-align:-1px}
.sw.c1{background:color-mix(in srgb,var(--s1) 22%,var(--surface));box-shadow:inset 0 -3px 0 var(--s1)}
.sw.c2{background:color-mix(in srgb,var(--s2) 22%,var(--surface));box-shadow:inset 0 -3px 0 var(--s2)}
.sw.c3{background:color-mix(in srgb,var(--s3) 22%,var(--surface));box-shadow:inset 0 -3px 0 var(--s3)}
.formula{margin:10px 0 0;font-family:var(--serif);font-size:22px;font-weight:700}
.formula .f.c1{color:var(--s1)} .formula .f.c2{color:var(--s2)} .formula .f.c3{color:var(--s3)}
.bnote{margin:4px 0 0;font-size:15px;color:var(--muted)}
.note{margin:8px 0 0;font-size:15px;color:var(--muted)}
.note:empty{display:none}
.tech{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.board.done .cell{color:var(--ink);border-color:var(--ink)}
.board.shown .cell{color:var(--muted)}
.cell.c1{background:color-mix(in srgb,var(--s1) 22%,var(--surface));box-shadow:inset 0 -5px 0 var(--s1)}
.cell.c2{background:color-mix(in srgb,var(--s2) 22%,var(--surface));box-shadow:inset 0 -5px 0 var(--s2)}
.cell.c3{background:color-mix(in srgb,var(--s3) 22%,var(--surface));box-shadow:inset 0 -5px 0 var(--s3)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>תשבצי<br>היגיון</h1>
    <div class="levels">
      <div class="cells" id="levels" role="radiogroup" aria-label="רמת קושי"></div>
      <div class="scale"><span>קל</span><span id="count"></span><span>קשה</span></div>
    </div>
  </header>

  <main>
    <p class="clue" id="clue"></p>
    <p class="meta" id="meta"></p>

    <div class="board" id="board">
      <input id="entry" type="text" dir="rtl" lang="he" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="התשובה שלך">
    </div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <section class="reveal" id="reveal" hidden>
      <div class="explain" id="explain"></div>
      <p class="note" id="note"></p>
      <p class="tech" id="tech"></p>
    </section>

    <div class="actions">
      <button class="btn primary" id="check">בדיקה</button>
      <button class="btn" id="split" aria-pressed="false">חלק לי</button>
      <button class="btn" id="hint">רמז</button>
    </div>
    <div class="links">
      <button class="link" id="first">גלה אות ראשונה</button>
      <button class="link" id="giveup">הצג פתרון</button>
      <button class="link" id="skip">הגדרה אחרת</button>
    </div>

    <ol class="hints" id="hints"></ol>
  </main>
</div>

const ORD=["הגדרה ראשונה","הגדרה שנייה","הגדרה שלישית","הגדרה רביעית"];
function q(s){return "„"+s+"”"}

  S.done=true; el.entry.disabled=true; el.entry.blur();
  const c=S.cur;
  if(gaveUp){ el.board.classList.add("shown"); renderBoard(norm(c.answer)); setMsg(""); el.reveal.classList.add("gaveup"); }
  else { setMsg("פתרת נכון","ok"); }
  paint(c); renderClue();
  renderExplain(c);
  el.tech.textContent="טכניקות: "+c.techniques.join(", ");
  el.reveal.hidden=false;
  updateButtons();
  const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.reveal.scrollIntoView({behavior:calm?"auto":"smooth",block:"nearest"});
}

el.entry.addEventListener("input",()=>{
  let v=typed().slice(0,total());
  const f=norm(S.cur.answer)[0];
  if(S.given && v[0]!==f) v=(f+v).slice(0,total());
  el.entry.value=v;
  el.board.classList.remove("bad");
  if(el.msg.classList.contains("bad")) setMsg("");
  renderBoard(v); updateButtons();
});
el.entry.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ev.preventDefault(); el.check.click();} });
el.entry.addEventListener("focus",()=>el.board.classList.add("focus"));
el.entry.addEventListener("blur",()=>el.board.classList.remove("focus"));

el.check.onclick=()=>{
  if(S.done){ load(nextClue()); el.entry.focus(); return; }
  if(typed()===norm(S.cur.answer)) finish(false);
  else{
    el.board.classList.remove("bad"); void el.board.offsetWidth; el.board.classList.add("bad");
    setMsg("לא נכון. אפשר לנסות שוב או לבקש רמז.","bad");
  }
};
el.split.onclick=()=>{ if(S.split<2) S.split++; renderClue(); renderBoard(typed()); updateButtons(); };
el.hint.onclick=()=>{
  if(S.hints>=S.cur.hints.length) return;
  const li=document.createElement("li");
  const n=document.createElement("span");n.className="hnum";n.textContent=`רמז ${S.hints+1}`;
  li.appendChild(n); li.appendChild(document.createTextNode(S.cur.hints[S.hints]));
  el.hints.appendChild(li); S.hints++; updateButtons();
};
el.giveup.onclick=()=>finish(true);
el.first.onclick=()=>{
  if(S.given) return;
  S.given=true;
  const f=norm(S.cur.answer)[0], v=typed();
  el.entry.value=(f+v.slice(1)).slice(0,total());
  renderBoard(el.entry.value); updateButtons(); el.entry.focus();
};
el.skip.onclick=()=>load(nextClue());
window.addEventListener("resize",()=>{ if(S.cur){ sizeBoard(); } });

buildLevels(); load(nextClue());
</script>
</body>
</html>
